name: test

on:
  workflow_call:
  pull_request:
    branches: '*'
    tags: '*'
  push:
    branches: '*'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run ruff check
        uses: astral-sh/ruff-action@v3
      - name: run ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: 'format --check'
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" , "3.13"]
        django-version: [ "5.0", "5.1" ]
        include:
          - python-version: "3.9"
            django-version: "4.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -U pip build django==${{ matrix.django-version }}
      - name: Run test
        run: |      
          python runtests.py
      - name: Build
        run: |
          python -m build